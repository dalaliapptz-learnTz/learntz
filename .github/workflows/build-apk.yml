name: Build Android APK & App Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - appbundle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Toolchain
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Android Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          flutter build apk --release --android-skip-build-dependency-validation --dart-define-from-file=config/production.json

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation --dart-define-from-file=config/production.json

      - name: Upload Release APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: learntz-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release App Bundle Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: learntz-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "The following production artifacts have been generated and attached to this workflow run:" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK:** \`app-release.apk\` (Downloadable directly from Artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release App Bundle (AAB):** \`app-release.aab\` (Google Play Console ready)" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** Production Supabase (\`https://jmllsuohmllklzhmhiva.supabase.co\`)" >> $GITHUB_STEP_SUMMARY
