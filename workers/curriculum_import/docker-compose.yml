services:
  clamav:
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/clamav:rw,noexec,nosuid,size=16m
    volumes:
      - clamav-db:/var/lib/clamav
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  curriculum_import_worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "true"
      OCR_LANGUAGES: ${OCR_LANGUAGES:-swa+eng}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}

volumes:
  clamav-db:
